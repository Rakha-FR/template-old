stages:
  - helm-upgrade
  - automated-security

.release_rules:
  rules:
    - if: '$APP_NAME == "data-services" && $APP_ENV == "development"'
      variables:
        FILE_VALUES: values-development.yaml
    - if: '$APP_NAME == "data-services" && $APP_ENV == "staging"'
      variables:
        FILE_VALUES: values-staging.yaml
    - if: '$APP_NAME == "data-services" && $APP_ENV == "production" && $APP_VERSION =~ "/^[1-9][0-9][0-9]{2}\.([0][1-9]|[1][0-2])\.([1-2][0-9]|[0][1-9]|[3][0-1])_production_doorv3-v.*$/"'
      variables:
        FILE_VALUES: values-production.yaml

.release_rules-client:
  rules:
    - if: '$APP_NAME == "data-services" && $APP_ENV == "production" && $CLIENT_NAME == "jagooit"'
      variables:
        FILE_VALUES: values-production.yaml

# ---------------------------------------------- Prepare Deploy -----------------------------------------------------

.before_deploy:
  stage: deploy
  before_script:
    - mkdir -p ~/.kube/
    - cp ${KUBE_CONFIG} ~/.kube/config

# -------------------------------------------------- Deploy ----------------------------------------------------------
deploy-data:
  stage: helm-upgrade
  extends: .before_deploy
  environment: $APP_ENV
  tags:
    - docker
    - internal
  image:
    name: dtzar/helm-kubectl
    entrypoint: [""]
  # script tahapan deploy
  script:
    # Do deploy
    - kubectl config set-context --current --namespace="${NAMESPACE_KUBERNETES}"
    - if [ -z $APP_NAME ]; then echo "APP_NAME is required"; exit 1; fi
    - if [ -z $APP_ENV ]; then echo "APP_ENV is required"; exit 1; fi
    - if [ -z $APP_VERSION ]; then echo "APP_VERSION is required"; exit 1; fi
    - echo "Deploying '$APP_NAME' to '$APP_ENV' using image.tag=$APP_VERSION"
    - 'sed -i "s/^appVersion:.*$/appVersion: $APP_VERSION/" "chart/data/Chart.yaml"'
    - >-
      helm upgrade data-services ./chart/data/ --values ./chart/data/values-development.yaml --namespace=$NAMESPACE_KUBERNETES
      --install
      --set image.version=$APP_VERSION
      --set name.space=$NAMESPACE_KUBERNETES
  #trigger pipeline
  rules:
    - !reference [.release_rules, rules]

deploy-data-client:
  stage: helm-upgrade
  extends: .before_deploy
  environment: $APP_ENV-$CLIENT_NAME
  tags:
    - docker
    - internal
  image:
    name: dtzar/helm-kubectl
    entrypoint: [""]
  # script tahapan deploy
  script:
    # Do deploy
    - kubectl config set-context --current --namespace="${NAMESPACE_KUBERNETES}"
    - if [ -z $APP_NAME ]; then echo "APP_NAME is required"; exit 1; fi
    - if [ -z $APP_ENV ]; then echo "APP_ENV is required"; exit 1; fi
    - if [ -z $APP_VERSION ]; then echo "APP_VERSION is required"; exit 1; fi
    - echo "Deploying '$APP_NAME' to '$APP_ENV' using image.tag=$APP_VERSION"
    - 'sed -i "s/^appVersion:.*$/appVersion: $APP_VERSION/" "chart/data/Chart.yaml"'
    - >-
      helm upgrade data-services ./chart/data/ --values ./chart/data/values-development.yaml --namespace=$NAMESPACE_KUBERNETES
      --install
      --set image.version=$APP_VERSION
      --set name.space=$NAMESPACE_KUBERNETES
      --set "ingress.hosts[0].host=$URL_DEPLOYMENT,ingress.tls[0].hosts[0]=$URL_DEPLOYMENT"
  #trigger pipeline
  rules:
    - !reference [.release_rules-client, rules]

scan-security-app:
  stage: automated-security
  image: owasp/zap2docker-stable
  tags:
    - docker
    - internal
  needs: ['deploy-data-client']
  environment:
    name: $APP_ENV-$CLIENT_NAME
  script: 
    - DATE_SCAN=$(date '+%Y-%m-%d')
    - FILE_NAME=owasp-report-$CI_PROJECT_NAME-$DATE_SCAN.html
    - echo $URL_DEPLOYMENT
    - mkdir -p /zap/wrk
    - zap-baseline.py -I -t https://$URL_DEPLOYMENT -r $FILE_NAME
    - mv /zap/wrk/$FILE_NAME $CI_PROJECT_DIR
  rules:
    - !reference [.release_rules-client, rules]
  artifacts:
    expire_in: "7 days"
    name: OWASP
    paths:
      - $CI_PROJECT_DIR/owasp-*.html