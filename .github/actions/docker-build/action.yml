name: Docker Build
description: "Composite action for docker image build"

inputs:
  HARBOR_HOST:
    description: "Harbor URL"
    required: true
  HARBOR_USERNAME:
    description: "Username for login to Harbor Server"
    required: true
  HARBOR_PASSWORD:
    description: "Password for login to Harbor Server"
    required: true
  HARBOR_PATH:
    description: "Path into image location"
    required: true
  DOCKERFILE_NAME:
    description: "Dockerile Name"
    required: false
    default: "Dockerfile"
  REPO_NAME:
    description: "Application Repository name"
    required: true
  APP_VERSION:
    description: "Version for docker image tag"
    required: true
  IMAGE_NAME:
    description: "Docker Image Name"
    required: false
    
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Harbor
      uses: docker/login-action@v3
      env:
        HARBOR_HOST: ${{ inputs.HARBOR_HOST }}
        HARBOR_USERNAME: ${{ inputs.HARBOR_USERNAME }}
        HARBOR_PASSWORD: ${{ inputs.HARBOR_PASSWORD }}
      with:
        registry: ${{ env.HARBOR_HOST }}
        username: ${{ env.HARBOR_USERNAME }}
        password: ${{ env.HARBOR_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v6
      env:
        DOCKERFILE_NAME: ${{ inputs.DOCKERFILE_NAME }}
        REPO_NAME: ${{ inputs.REPO_NAME }}
        APP_VERSION: ${{ inputs.APP_VERSION }}
        HARBOR_HOST: ${{ inputs.HARBOR_HOST }}
        HARBOR_PATH: ${{ inputs.HARBOR_PATH }}
        IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
      with:
        context: .
        file: ${{ env.DOCKERFILE_NAME }}
        push: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
        cache-from: type=registry,ref=${{ env.HARBOR_HOST }}/${{ env.HARBOR_PATH }}/${{ env.REPO_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.HARBOR_HOST }}/${{ env.HARBOR_PATH }}/${{ env.REPO_NAME }}:buildcache,image-manifest=true,oci-mediatypes=true,mode=max
