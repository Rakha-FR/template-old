name: Docker Build
description: "Composite action for docker image build"

inputs:
  REGISTRY_URL:
    description: "Harbor URL"
    required: true
  REGISTRY_USERNAME:
    description: "Username for login to Harbor Server"
    required: true
  REGISTRY_PASSWORD:
    description: "Password for login to Harbor Server"
    required: true
  DOCKERFILE_NAME:
    description: "Dockerile Name"
    required: false
    default: "Dockerfile"
  REPO_NAME:
    description: "Application Repository name"
    required: true
  APP_VERSION:
    description: "Version for docker image tag"
    required: true
  IMAGE_NAME:
    description: "Docker Image Name"
    required: false
  mvn_version:
    description: "Maven build version"
    required: false
    
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Harbor
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.REGISTRY_URL }}
        username: ${{ inputs.REGISTRY_USERNAME }}
        password: ${{ inputs.REGISTRY_PASSWORD }}

    - name: debug file path
      shell: bash
      run: |
        ls -l
        ls  -l dbs-service-api-integration/dbs-service-api-integration

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: maven-artifact
        path: dbs-service-api-integration/target

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.DOCKERFILE_NAME }}
        push: true
        tags: ${{ inputs.IMAGE_NAME }}:${{ inputs.APP_VERSION }}
        cache-from: type=registry,ref=${{ inputs.IMAGE_NAME }}:buildcache
      env:
        mvn_version: ${{ inputs.mvn_version }}