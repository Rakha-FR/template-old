name: "Build Maven Application"
description: "Composite action for building a Maven project"

inputs:
  GITHUB_TOKEN:
    description: "GitHub Token for authentication"
    required: true
  REPO_OWNER:
    description: "Repository Owner"
    required: true
  REPO_NAME:
    description: "Repository Name"
    required: true
  PACKAGE_NAME:
    description: "Maven Package Name"
    required: true
  PERSONAL_TOKEN:
    description: "Personal Access Token for publishing packages"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Check the latest package version
      shell: bash
      id: check_version
      run: |
        #!/bin/bash
        set +e
        
        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/orgs/${{ inputs.REPO_OWNER }}/packages/maven/${PACKAGE_NAME}/versions")
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        
        echo "HTTP Code: $HTTP_CODE"
        echo "Response Body: $BODY"
        
        if [[ "$HTTP_CODE" == "404" ]] || echo "$BODY" | grep -q "Package not found"; then
          echo "⚠️ Package ${PACKAGE_NAME} not found in org ${REPO_OWNER}. Using default version 1.0.0."
          LATEST_VERSION="1.0.0"
        else
          LATEST_VERSION=$(echo "$BODY" | grep -m1 '"name":' | sed -E 's/.*"name": *"([^"]+)".*/\1/')
          echo "✅ Latest version found: $LATEST_VERSION"
        fi
        
        # Parse version
        BASE_VERSION=$(echo "$LATEST_VERSION" | cut -d'-' -f1)
        MAJOR=$(echo "$BASE_VERSION" | cut -d'.' -f1)
        MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f2)
        PATCH=$(echo "$BASE_VERSION" | cut -d'.' -f3)
        
        # Validasi dan set default jika kosong
        if [[ -z "$PATCH" || "$PATCH" == "null" || "$PATCH" == "" ]]; then
          MAJOR=1
          MINOR=0
          PATCH=0
        fi
        
        # Increment patch version
        MVN_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
        echo "🆕 New version will be: $MVN_VERSION"
        
        # Export ke environment
        echo "MVN_VERSION=$MVN_VERSION" >> $GITHUB_ENV
        echo "MVN_VERSION=$MVN_VERSION" >> $GITHUB_OUTPUT
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        REPO_OWNER: ${{ inputs.REPO_OWNER }}
        REPO_NAME: ${{ inputs.REPO_NAME }}
        PACKAGE_NAME: ${{ inputs.PACKAGE_NAME }}

    - name: Build Maven Application
      shell: bash
      run: mvn clean package -s ci_settings.xml
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        REPO_OWNER: ${{ inputs.REPO_OWNER }}
        REPO_NAME: ${{ inputs.REPO_NAME }}
        PACKAGE_NAME: ${{ inputs.PACKAGE_NAME }}
        PERSONAL_TOKEN: ${{ inputs.PERSONAL_TOKEN }}

    - name: Publish Maven Application
      shell: bash
      run: mvn clean deploy -s ci_settings.xml
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        REPO_OWNER: ${{ inputs.REPO_OWNER }}
        REPO_NAME: ${{ inputs.REPO_NAME }}
        PACKAGE_NAME: ${{ inputs.PACKAGE_NAME }}
        PERSONAL_TOKEN: ${{ inputs.PERSONAL_TOKEN }}
