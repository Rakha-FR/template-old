name: "Build Maven Application"
description: "Composite action for building a Maven project"

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'maven'

    - name: Install Maven
      shell: bash
      run: |
        apt-get update
        apt-get install -y maven

    - name: Build and Test
      shell: bash
      run: mvn --batch-mode clean verify

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: maven-build-artifacts
        path: '**/target/*.jar'
