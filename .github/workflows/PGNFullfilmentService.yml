name: Fullfilment Services Pipelines
on:
  workflow_call:

jobs:
  define-environment:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.merged == true ||
        github.event.pull_request.state == 'open' ||
        github.event.action == 'synchronize')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on:
      group: Development
      labels: [self-hosted, Linux, X64, Development]
    outputs:
      branch_env: ${{ steps.branch.outputs.environment }}
      runner_group: ${{ steps.branch.outputs.runner_group }}
      repo_name: ${{ steps.branch.outputs.repo_name }}
      repo_owner: ${{ steps.branch.outputs.repo_owner }}
      app_version: ${{ steps.branch.outputs.app_version }}
      deploy_targets: ${{ steps.branch.outputs.deploy_targets }}
    steps:
      - name: Define Env
        id: branch
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/neuron-actions/set-enviroment@migrasi
        with:
          deploy_to: 'RELYON'
          allowed_branches: "253-devops---move-jenkins-to-github-actions"

  code-quality:
    needs: [define-environment]
    if: needs.define-environment.result == 'success'
    uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/workflows/code-quality.yml@migrasi
    with:
      grouprunner: ${{ needs.define-environment.outputs.runner_group }}
      SONAR_EXCLUSIONS: '**/*.html,**/*.phtml,**/*.css,**/*.js'
      SONAR_SOURCES: "./app/Models"
      SONAR_HOST_URL: "http://10.129.2.232:9000"
      SONAR_USER_HOME: ${{ github.workspace }}
      continue-on-error: true
      repo_name: ${{ needs.define-environment.outputs.repo_name }}
      repository_owner: ${{ needs.define-environment.outputs.repo_owner }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  
  Unit-Test:
    needs: [define-environment]
    if: needs.define-environment.result == 'success'
    name: Run tests
    runs-on:
      group: ${{ needs.define-environment.outputs.runner_group }}
      labels: [self-hosted, Linux, X64, "${{ needs.define-environment.outputs.runner_group }}"]
    container:
      image: registry.pgn.co.id/base/php82:v0.0.1
      env:
        XDEBUG_MODE: coverage   
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies & prepare env
        run: |
          echo "::group::Install dependencies"
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          echo "::endgroup::"

      - name: Install Xdebug (temporary, via pecl)
        run: |
          echo "::group::Install Xdebug"
          php -v
          php -m | grep xdebug || echo "xdebug belum ada, install dulu"


          apt-get update
          apt-get install -y git zip unzip autoconf pkg-config build-essential

          pecl install xdebug


          EXT_DIR="$(php-config --extension-dir)"
          echo "zend_extension=${EXT_DIR}/xdebug.so" > /usr/local/etc/php/conf.d/xdebug.ini

          echo "Loaded extensions:"
          php -m | grep xdebug || echo "xdebug masih belum kedeteksi"
          echo "::endgroup::"

      - name: Run Unit Test & generate JUnit + Coverage
        run: |
          echo "::group::Run PHPUnit"
          mkdir -p build/test-results
          php artisan test \
            --log-junit build/test-results/phpunit-report.xml \
            --coverage-clover build/test-results/coverage.xml
          echo "Isi folder build/test-results:"
          ls -l build/test-results || true
          echo "::endgroup::"

      - name: Publish Unit Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/test-results/phpunit-report.xml



  dependency-check:
    needs: [define-environment]
    if: needs.define-environment.result == 'success'
    name: Dependency Check (OWASP)
    runs-on:
      group: ${{ needs.define-environment.outputs.runner_group }}
      labels: [self-hosted, Linux, X64, "${{ needs.define-environment.outputs.runner_group }}"]
    continue-on-error: true   

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: owasp-dc-${{ runner.os }}-cache

      - name: Download OWASP Dependency-Check
        run: |
          DC_VERSION=9.0.9
          curl -sSL -o dependency-check.zip "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          unzip -q dependency-check.zip -d dependency-check

      - name: Run OWASP Dependency-Check
        run: |
          mkdir -p build/dependency-check
          ./dependency-check/dependency-check/bin/dependency-check.sh \
            --project "PGNMobile-PGNFullfilmentService" \
            --scan . \
            --nvdApiKey "${{ secrets.NVD_API_KEY }}" \
            --format "HTML" \
            --format "XML" \
            --out build/dependency-check \
            --failOnCVSS 7 || true


      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/dependency-check
          retention-days: 1


  build:
    needs: define-environment
    if: needs.define-environment.result == 'success'
    uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/workflows/build-template.yml@migrasi
    with:
      repo_name: ${{ needs.define-environment.outputs.repo_name }}
      branch_env: ${{ needs.define-environment.outputs.branch_env }}
      deploy_targets: ${{ needs.define-environment.outputs.deploy_targets }}
      runner_group: ${{ needs.define-environment.outputs.runner_group }}
      app_version: ${{ needs.define-environment.outputs.app_version }}
    secrets: inherit

  deploy:
    needs: [define-environment, build]
    if: needs.define-environment.result == 'success'
    uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/workflows/deploy-template.yml@migrasi
    with:
      repo_name: ${{ needs.define-environment.outputs.repo_name }}
      branch_env: ${{ needs.define-environment.outputs.branch_env }}
      deploy_targets: ${{ needs.define-environment.outputs.deploy_targets }}
      runner_group: ${{ needs.define-environment.outputs.runner_group }}
      app_version: ${{ needs.define-environment.outputs.app_version }}
    secrets: inherit