name: Fullfilment Services Pipelines

permissions:
  contents: read
  security-events: write
  
on:
  workflow_call:

jobs:
  define-environment:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.merged == true ||
        github.event.pull_request.state == 'open' ||
        github.event.action == 'synchronize')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      branch_env: ${{ steps.branch.outputs.environment }}
      runner_group: ${{ steps.branch.outputs.runner_group }}
      repo_name: ${{ steps.branch.outputs.repo_name }}
      repo_owner: ${{ steps.branch.outputs.repo_owner }}
      app_version: ${{ steps.branch.outputs.app_version }}
      deploy_targets: ${{ steps.branch.outputs.deploy_targets }}
    steps:
      - name: Define Env
        id: branch
        uses: Rakha-FR/template-old/neuron-actions/set-enviroment@migrasi
        with:
          deploy_to: 'RELYON'
          allowed_branches: "253-devops---move-jenkins-to-github-actions"

  code-quality:
    needs: [define-environment]
    if: needs.define-environment.result == 'success'
    uses: Rakha-FR/template-old/.github/workflows/code-quality.yml@migrasi
    with:
      grouprunner: ${{ needs.define-environment.outputs.runner_group }}
      SONAR_EXCLUSIONS: '**/*.html,**/*.phtml,**/*.css,**/*.js'
      SONAR_SOURCES: "./app/Models"
      SONAR_HOST_URL: "http://10.129.2.232:9000"
      SONAR_USER_HOME: ${{ github.workspace }}
      continue-on-error: true
      repo_name: ${{ needs.define-environment.outputs.repo_name }}
      repository_owner: ${{ needs.define-environment.outputs.repo_owner }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  
  Unit-Test:
    needs: [define-environment]
    if: needs.define-environment.result == 'success'
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: rakhafr/php8.2
      env:
        XDEBUG_MODE: coverage
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Prepare container (install composer, git, unzip)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git unzip curl ca-certificates $PHPIZE_DEPS
          if ! command -v composer >/dev/null 2>&1; then
            curl -sS https://getcomposer.org/installer -o composer-setup.php
            php composer-setup.php --install-dir=/usr/local/bin --filename=composer
            rm composer-setup.php
          fi
          composer --version
          # Validate and check platform requirements to surface issues early
          composer validate --no-check-publish || true
          composer check-platform-reqs || true

          # Install dependencies. Do NOT run `composer update` in CI (it mutates lockfile).
          if ! composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist; then
            echo "composer install failed; retrying with --ignore-platform-reqs (temporary fallback)"
            composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs
          fi

          php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Xdebug
        shell: bash -l {0}
        run: |
          set -euo pipefail
          export XDEBUG_MODE=coverage

          if ! php -m | grep -q xdebug; then
            echo "📦 Installing Xdebug..."
            {
              apt-get update -qq &&
              apt-get install -y -qq $PHPIZE_DEPS &&
              pecl install xdebug &&
              docker-php-ext-enable xdebug
            } > /dev/null 2>&1

            if [ $? -eq 0 ]; then
              echo "✅ Installation completed"
            else
              echo "❌ Installation failed"
              exit 1
            fi
          fi

          php -m | grep xdebug || true

      - name: Run Unit Test with Coverage
        run: |
          mkdir -p build/test-results
          php artisan test -d memory_limit=512M \
            --log-junit build/test-results/phpunit-report.xml \
            --coverage-cobertura build/test-results/cobertura-report.xml \
            --coverage-text | tee build/test-results/coverage-output.txt

      - name: Verify Coverage Report
        if: always()
        run: |
          if [ ! -f build/test-results/cobertura-report.xml ]; then
            echo "❌ cobertura report not generated!"
            exit 1
          fi
          if ! grep -q -E 'coveredstatements|coveredelements|coveredmethods|lines-covered' build/test-results/cobertura-report.xml; then
            echo "❌ Invalid coverage data in cobertura report!"
            head -n 60 build/test-results/cobertura-report.xml || true
            exit 1
          fi
          echo "✅ Coverage report validated"
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: build/test-results
          retention-days: 30
  
  Publish-Unit-Test:
    needs: 
      - Unit-Test
      - define-environment
    if: always() && needs.Unit-Test.result != 'skipped'
    name: Publish tests
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: build/test-results
          
      - name: Publish Test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/test-results/phpunit-report.xml

      - name: Generate Coverage Report & Badge
        uses: insightsengineering/coverage-action@v3.0.1
        with:
          path: build/test-results/cobertura-report.xml
          threshold: 80
          publish: true
          diff: true
          diff-branch: ${{ github.event.pull_request.base.ref || 'main' }}
          diff-storage: _xml_coverage_reports
          toggler-report: true
          coverage-reduction-failure: true
          new-uncovered-statements-failure: false
          coverage-summary-title: "📊 Code Coverage Summary"
          
      - name: Add Coverage Badge to README (Optional)
        if: github.ref == 'refs/heads/main' && always()
        run: |
          echo "Badge URL tersedia di:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/_xml_coverage_reports/badges/main/test-coverage.svg"
          echo ""
          echo "Tambahkan ke README.md:"
          echo '![Coverage](https://raw.githubusercontent.com/${{ github.repository }}/_xml_coverage_reports/badges/main/test-coverage.svg)'
  trivy-dependency-scan:
    needs: [define-environment]
    if: needs.define-environment.result == 'success'
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-

      # - name: Run Trivy vulnerability scanner in repo mode
      #   uses: aquasecurity/trivy-action@0.28.0
      #   with:
      #     scan-type: 'fs'
      #     scan-ref: .
      #     ignore-unfixed: true
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'CRITICAL'         
      #     cache-dir: '~/.cache/trivy'

      # - name: Upload Trivy scan results to GitHub Security tab
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner in repo mode (table)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          scan-ref: .
          ignore-unfixed: true
          format: 'table'            
          severity: 'HIGH,CRITICAL'  
          cache-dir: '~/.cache/trivy'
          exit-code: '1' 

  build:
    needs: define-environment
    if: needs.define-environment.result == 'success'
    uses: Rakha-FR/template-old/.github/workflows/build-template.yml@migrasi
    with:
      repo_name: ${{ needs.define-environment.outputs.repo_name }}
      branch_env: ${{ needs.define-environment.outputs.branch_env }}
      deploy_targets: ${{ needs.define-environment.outputs.deploy_targets }}
      runner_group: ${{ needs.define-environment.outputs.runner_group }}
      app_version: ${{ needs.define-environment.outputs.app_version }}
    secrets: inherit

  deploy:
    needs: [define-environment, build]
    if: needs.define-environment.result == 'success'
    uses: Rakha-FR/template-old/.github/workflows/deploy-template.yml@migrasi
    with:
      repo_name: ${{ needs.define-environment.outputs.repo_name }}
      branch_env: ${{ needs.define-environment.outputs.branch_env }}
      deploy_targets: ${{ needs.define-environment.outputs.deploy_targets }}
      runner_group: ${{ needs.define-environment.outputs.runner_group }}
      app_version: ${{ needs.define-environment.outputs.app_version }}
    secrets: inherit
