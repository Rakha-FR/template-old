name: Run workflows For Enrergy Application Backend

on:
  workflow_call:
    inputs:
      RUNNER_GROUP:
        required: true
        type: string
      SQ_RULES:
        required: false
        type: string
      MERGED_RULES:
        required: false
        type: string
      MANUAL_RULES:
        required: false
        type: string
      APP_VERSION:
        required: false
        type: string
      ENV_SERVER:
        required: true
        type: string
      REPO_OWNER:
        required: true
        type: string
      REPO_NAME:
        required: true
        type: string
      DOCKERFILE_NAME:
        required: false
        type: string
      ARTIFACT_NAME:
        required: false
        type: string
      ARTIFACT_PATH:
        required: false
        type: string
      FILE_VALUES:
        required: false
        type: string

jobs:
  sonarqube-scan:
    if: ${{ inputs.SQ_RULES == 'true' }}
    runs-on:
      group: ${{ inputs.RUNNER_GROUP }}
      labels: [self-hosted, Linux, X64, "${{ inputs.RUNNER_GROUP }}"]
    steps:
      - name: SonarQube Scan
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/actions/sonar-scan@migrasi
        with:
          RUNNER_GROUP: ${{ inputs.RUNNER_GROUP }}
          SONAR_EXCLUSIONS: ""
          SONAR_SOURCES: "./src"
          SONAR_USER_HOME: ${{ github.workspace }}
          continue-on-error: true
          REPO_NAME: ${{ inputs.REPO_NAME }}
          REPO_OWNER: ${{ inputs.REPO_OWNER }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-application:
    if: ${{ inputs.MERGED_RULES == 'true' ||inputs.MANUAL_RULES == 'true' }}
    environment: ${{ inputs.ENV_SERVER }}
    runs-on:
      group: ${{ inputs.RUNNER_GROUP }}
      labels: [self-hosted, Linux, X64, "${{ inputs.RUNNER_GROUP }}"]
    outputs:
      mvn_version: ${{ steps.build_maven.outputs.mvn_version }}
    steps:
      - name: Build Maven Application
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/actions/mvn-build@migrasi
        id: build_maven
        with:
          REPO_OWNER: ${{ inputs.REPO_OWNER }}
          REPO_NAME: ${{ inputs.REPO_NAME }}
          ENV_SERVER: ${{ inputs.ENV_SERVER }}
      - name: Build and Push Docker Image
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/actions/docker-build@migrasi
        with:
          DOCKERFILE_NAME: ${{ inputs.DOCKERFILE_NAME }}
          REPO_NAME: ${{ inputs.REPO_NAME }}

  deploy-application:
    if: ${{ inputs.MERGED_RULES == 'true' ||inputs.MANUAL_RULES == 'true' }}
    environment: ${{ inputs.ENV_SERVER }}
    needs: build-application
    runs-on:
      group: ${{ inputs.RUNNER_GROUP }}
      labels: [self-hosted, Linux, X64, "${{ inputs.RUNNER_GROUP }}"]
    steps:
      - name: Deploy to Kubernetes
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/actions/deploy-kubernetes@migrasi
        with:
          APP_VERSION: ${{ inputs.APP_VERSION }}
          FILE_VALUES: ${{ inputs.FILE_VALUES }}
