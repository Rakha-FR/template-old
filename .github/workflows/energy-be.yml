name: Run workflows For Enrergy Application Backend

on:
  workflow_call:
    inputs:
      RUNNER_GROUP:
        required: true
        type: string
      SQ_RULES:
        required: false
        type: string
      MERGED_RULES:
        required: false
        type: string
      MANUAL_RULES:
        required: false
        type: string
      APP_VERSION:
        required: false
        type: string
      ENV_SERVER:
        required: true
        type: string
      REPO_OWNER:
        required: true
        type: string
      REPO_NAME:
        required: true
        type: string
      DOCKERFILE_NAME:
        required: false
        type: string
      

jobs:
  sonarqube-scan:
    if: ${{ inputs.SQ_RULES == 'true' }}
    runs-on:
      group: ${{ inputs.RUNNER_GROUP }}
      labels: [self-hosted, Linux, X64, "${{ inputs.RUNNER_GROUP }}"]
    environment: ${{ inputs.ENV_SERVER }}
    steps:
      - name: SonarQube Scan
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/actions/sonar-scan@migrasi
        with:
          RUNNER_GROUP: ${{ inputs.RUNNER_GROUP }}
          SONAR_EXCLUSIONS: ""
          SONAR_SOURCES: "./src"
          SONAR_USER_HOME: ${{ github.workspace }}
          continue-on-error: true
          REPO_NAME: ${{ inputs.REPO_NAME }}
          REPO_OWNER: ${{ inputs.REPO_OWNER }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-maven:
    if: ${{ inputs.MERGED_RULES == 'true' ||inputs.MANUAL_RULES == 'true' }}
    container:
      image: maven:3.9.6-eclipse-temurin-17
    environment: ${{ inputs.ENV_SERVER }}
    runs-on:
      group: ${{ inputs.RUNNER_GROUP }}
      labels: [self-hosted, Linux, X64, "${{ inputs.RUNNER_GROUP }}"]
    steps:
      - name: Build Maven Application
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/actions/mvn-build@migrasi
        with:
          REPO_OWNER: ${{ inputs.REPO_OWNER }}
          REPO_NAME: ${{ inputs.REPO_NAME }}
          ENV_SERVER: ${{ inputs.ENV_SERVER }}
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

  build-image:
    if: ${{ inputs.MERGED_RULES == 'true' ||inputs.MANUAL_RULES == 'true' }}
    needs: build-maven
    environment: ${{ inputs.ENV_SERVER }}
    runs-on:
      group: ${{ inputs.RUNNER_GROUP }}
      labels: [self-hosted, Linux, X64, "${{ inputs.RUNNER_GROUP }}"]
    steps:
      - name: Build Docker Image
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/actions/docker-build@migrasi
        with:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ vars.REGISTRY_PASSWORD }}
          DOCKERFILE_NAME: ${{ inputs.DOCKERFILE_NAME }}
          REPO_NAME: ${{ inputs.REPO_NAME }}
          APP_VERSION: ${{ inputs.APP_VERSION }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}