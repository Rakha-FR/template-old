name: Define Env

on:
  push:
    paths:
      - 'neuron-actions/env-lists/**'
  pull_request:
    paths:
      - 'neuron-actions/env-lists/**'

permissions:
  contents: write

jobs:
  build-env-lists:
    runs-on:
      group: Development
      labels: [self-hosted,Linux,X64,Development]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build env-lists
        run: |
          cd neuron-actions/env-lists
          npm install
          npm run build

      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add neuron-actions/env-lists/dist
          git commit -m "Build env-lists action [skip ci]" || echo "No changes to commit"
          git push
