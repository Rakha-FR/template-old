name: Build Template

on:
  workflow_call:
    inputs:
      runner_group:
        required: true
        type: string
      branch_env:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_owner:
        required: true
        type: string
      app_version:
        required: true
        type: string
      deploy_targets:
        required: true
        type: string 

jobs:
  Build:
    if: ${{ (github.event.pull_request.merged || github.event_name != 'pull_request') }}
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: [self-hosted, Linux, X64, "${{ inputs.runner_group }}"]

    strategy:
      matrix:
        deploy-to: ${{ fromJSON(inputs.deploy_targets) }}
        monorepo: [frontend, backend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import All Secrets from Vault
        id: import-secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_HOST_URL }}
          method: userpass
          username: ${{ secrets.VAULT_USERNAME }}
          password: ${{ secrets.VAULT_PASSWORD }}
          exportEnv: true
          secrets: |
            neuron/data/${{ matrix.deploy-to }}-${{ inputs.branch_env }}/github-action/${{ inputs.repo_name }}/secret * ;

      # Build Frontend
      - name: Setup Node
        if: ${{ matrix.monorepo == 'frontend' }}
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.monorepo }}/package-lock.json

      - name: Install Frontend Dependencies
        if: ${{ matrix.monorepo == 'frontend' }}
        run: npm install --legacy-peer-deps
        working-directory: ${{ matrix.monorepo }}

      - name: Build Frontend
        if: ${{ matrix.monorepo == 'frontend' }}
        run: npm run build
        working-directory: ${{ matrix.monorepo }}

      # Checkout DevOps Repo
      - name: Checkout DevOps repository
        uses: actions/checkout@v5
        with:
          repository: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService
          token: ${{ secrets.TOKEN }}
          path: devops-repo
          ref: migrasi

      # Docker setup
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_HOST }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      # Build and Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops-repo/collection/${{ inputs.repo_name }}/Dockerfile-${{ matrix.monorepo }}
          push: true
          tags: ${{ env.HARBOR_HOST }}/${{ env.HARBOR_PATH }}/${{ inputs.repo_name }}:${{ matrix.monorepo }}-${{ inputs.app_version }}-${{ matrix.deploy-to }}
          cache-from: type=registry,ref=${{ env.HARBOR_HOST }}/${{ env.HARBOR_PATH }}/${{ inputs.repo_name }}:buildcache-${{ matrix.monorepo }}
