name: OCR Services Pipelines
on:
  workflow_call:

jobs:
  define-environment:
    runs-on:
      group: OCR-Development
      labels: [self-hosted, Linux, X64, Development, OCR]
    outputs:
      branch_env: ${{ steps.branch.outputs.environment }}
      runner_group: ${{ steps.branch.outputs.runner_group }}
      repo_name: ${{ steps.branch.outputs.repo_name }}
      repo_owner: ${{ steps.branch.outputs.repo_owner }}
      app_version: ${{ steps.branch.outputs.app_version }}
      deploy_targets: ${{ steps.branch.outputs.deploy_targets }}
    steps:
      - name: Define Env
        id: branch
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/neuron-actions/set-enviroment@migrasi
        with:
          allowed_branches: "7-devops---setup-github-action"
  
  ssh:
    needs: [define-environment]
    runs-on:
      group: OCR-Development
      labels: [self-hosted, Linux, X64, Development, OCR]
    steps:
    - name: Start SSH Agent and Add Key
      run: |
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa <<< "${{ secrets.SSH_PASSWORD }}"

    - name: Ensure known_hosts (avoid interactive prompt)
      run: |
        # replace IP_OR_HOST with 10.129.2.35 or domain
        ssh-keyscan -H 10.129.2.35 >> ~/.ssh/known_hosts

    - name: SSH to remote and run command
      run: |
        ssh -o StrictHostKeyChecking=yes developers@10.129.2.35 "hostname && whoami"



  
    