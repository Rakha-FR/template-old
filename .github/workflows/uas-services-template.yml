name: UAS Services Pipelines
on:
  workflow_call:

jobs:
  define-environment:
    runs-on:
      group: Development
      labels: [self-hosted, Linux, X64, Development]
    outputs:
      branch_env: ${{ steps.branch.outputs.environment }}
      runner_group: ${{ steps.branch.outputs.runner_group }}
      repo_name: ${{ steps.branch.outputs.repo_name }}
      repo_owner: ${{ steps.branch.outputs.repo_owner }}
      app_version: ${{ steps.branch.outputs.app_version }}
      deploy_targets: ${{ steps.branch.outputs.deploy_targets }}
    steps:
      - name: Define Env
        id: branch
        uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/neuron-actions/set-enviroment@migrasi
        with:
          deploy_to: 'RELYON'
          allowed_branches: "441-devops---migrasi-jenkins-to-github-action-relyon"

  code-quality:
    needs: [define-environment]
    uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/.github/workflows/code-quality.yml@migrasi
    with:
      grouprunner: ${{ needs.define-environment.outputs.runner_group }}
      SONAR_EXCLUSIONS: '**/*.html,**/*.phtml,**/*.css,**/*.js'
      SONAR_SOURCES: './backend/application/Neuron/Application/Uservices,./frontend/src'
      SONAR_HOST_URL: "http://10.129.2.232:9000"
      SONAR_USER_HOME: ${{ github.workspace }}
      continue-on-error: true
      repo_name: ${{ needs.define-environment.outputs.repo_name }}
      repository_owner: ${{ needs.define-environment.outputs.repo_owner }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
  Build:
    needs: [define-environment]
    runs-on:
      group: ${{ needs.define-environment.outputs.runner_group }}
      labels: [self-hosted, Linux, X64, "${{ needs.define-environment.outputs.runner_group }}"]
    strategy:
      matrix:
        deploy-to: ${{ fromJSON(needs.define-environment.outputs.deploy_targets) }}
        monorepo: [be, fe]  

    steps:
    - name: Checkout
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0

    # - name: Import All Secrets from Vault
    #   id: import-secrets
    #   uses: hashicorp/vault-action@v3.4.0
    #   with:
    #     url: ${{ secrets.VAULT_HOST_URL }}
    #     method: userpass
    #     username: ${{ secrets.VAULT_USERNAME }}
    #     password: ${{ secrets.VAULT_PASSWORD }}
    #     exportEnv: true
    #     secrets: |
    #       neuron/data/${{ matrix.deploy-to }}-${{ needs.define-environment.outputs.branch_env }}/github-action/${{ needs.define-environment.outputs.repo_name }}/secret * ;

    - name: Build & Push Frontend ${{ matrix.monorepo }}
      if: matrix.monorepo == 'fe'
      uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/neuron-actions/build-frontend@migrasi
      with:
        deploy_to: ${{ matrix.deploy-to }}
        monorepo: ${{ matrix.monorepo }}
  
    - name: Build & Push Frontend ${{ matrix.monorepo }}
      if: matrix.monorepo == 'be'
      uses: PT-Perusahaan-Gas-Negara-Tbk/DevSecOps-DataService/neuron-actions/build-frontend@migrasi
      with:
        deploy_to: ${{ matrix.deploy-to }}
        monorepo: ${{ matrix.monorepo }}

