# Default values for technoday.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  hosts:
    - host: dev-data-pgnmobile.pgn.co.id
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pgn.co.id-tls
      hosts:
        - dev-data-pgnmobile.pgn.co.id

image:
  repository: hub.pgn.co.id/neuron/data
  secret: uam-pull-secret
  pullPolicy: IfNotPresent

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

volumeMounts:
  name: php-configmap-elastic-apm
  path: /opt/elastic/apm-agent-php/etc

configMap:
  name: apm-agent-php-data

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 500Mi

secretref:
  name: data-secret