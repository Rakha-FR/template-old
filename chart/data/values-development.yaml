# Default values for technoday.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  hosts:
    - host: dev-data-pgnmobile.pgn.co.id
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pgn.co.id-tls
      hosts:
        - dev-data-pgnmobile.pgn.co.id

image:
  repository: hub.pgn.co.id/neuron/data
  secret: uam-pull-secret
  pullPolicy: IfNotPresent

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

volumeMounts:
  name: php-configmap-elastic-apm
  path: /opt/elastic/apm-agent-php/etc

configMap:
  name: apm-agent-php-data

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 500Mi

secretref:
  name: data-secret

serviceAccount:
  name: vault-integration

vault:
  enabled: true
  annotations:
    vault.hashicorp.com/agent-inject: 'true'
    vault.hashicorp.com/role: 'pgn-development'
    vault.hashicorp.com/agent-inject-secret-.env: 'neuron/data/development/data/secret'
    vault.hashicorp.com/secret-volume-path: '/vault/secret'
    vault.hashicorp.com/template-static-secret-render-interval: '5'
    vault.hashicorp.com/agent-share-process-namespace: 'true'
    vault.hashicorp.com/agent-image: 'hub.pgn.co.id/base/vault-inject-custom:v1.2'
    vault.hashicorp.com/agent-inject-command-.env: "sh /opt/restart_deployment.sh"
    vault.hashicorp.com/agent-inject-template-.env: |
            {{- with secret "neuron/data/development/data/secret" }}{{ range $k, $v := .Data.data -}}
            {{- $k }}={{ $v }}
            {{ end }}{{ end -}}