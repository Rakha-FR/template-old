name: "Generate App Version"
description: "Generate version string from repo, env, branch, and commit hash"

inputs:
  repo_name:
    description: "Repository name (lowercase preferred)"
    required: true

outputs:
  app-version:
    description: "Generated app version"
    value: ${{ steps.generate.outputs.app-version }}

runs:
  using: "composite"
  steps:
    - name: Generate App Version
      id: generate
      shell: bash
      run: |
        REPO_NAME="${{ inputs.repo_name }}"
        BRANCH_NAME="${GITHUB_REF_NAME}"
        DATE=$(date +'%Y%m%d')
        COMMIT_HASH=$(echo "${GITHUB_SHA}" | cut -c1-7)
        APP_VERSION="${REPO_NAME}_${BRANCH_NAME}_${DATE}_${COMMIT_HASH}"
        echo "✅ APP_VERSION=$APP_VERSION"
        echo "app-version=$APP_VERSION" >> $GITHUB_OUTPUT
