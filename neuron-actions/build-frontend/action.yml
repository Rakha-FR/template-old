name: "Build Frontend"
description: "Simple echo test for frontend build"
inputs:
  node-version:
    description: ""
    required: true
  cache:
    description: ""
    required: true
  cache-dependency-path:
    description: ""
    required: false
  working-directory:
    description: ""
    required: true
  token:
    description: ""
    required: true

runs:
  using: "composite"
  steps:
    - name: Echo frontend build
      shell: bash
      run: |
        echo "🚀 Building FRONTEND"
        echo "Deploy to: ${{ inputs.deploy_to }}"
        echo "Monorepo: ${{ inputs.monorepo }}"
