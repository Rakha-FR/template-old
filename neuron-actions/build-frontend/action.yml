name: "Build Frontend"
description: "Simple echo test for frontend build"
inputs:
  deploy_to:
    description: "Target environment"
    required: true
  monorepo:
    description: "Project type"
    required: true

runs:
  using: "composite"
  steps:
    - name: Echo frontend build
      shell: bash
      run: |
        echo "🚀 Building FRONTEND"
        echo "Deploy to: ${{ inputs.deploy_to }}"
        echo "Monorepo: ${{ inputs.monorepo }}"
