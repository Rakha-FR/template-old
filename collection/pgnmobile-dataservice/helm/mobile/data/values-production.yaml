# Default values for technoday.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: data-pgnmobile.pgn.co.id
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: tls-secret
      hosts:
        - data-pgnmobile.pgn.co.id

image:
  repository: registry.pgn.co.id/neuron/pgnmobile-dataservice
  secret: new-pull-secret
  pullPolicy: IfNotPresent

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 15
  maxReplicas: 30
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

volumeMounts:
  name: php-configmap-elastic-apm
  path: /opt/elastic/apm-agent-php/etc

configMap:
  name: apm-agent-php-data

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 500Mi

secretref:
  name: data-apm-secret

serviceAccount:
  name: vault-integration

vault:
  enabled: true
  annotations:
    vault.hashicorp.com/agent-inject: 'true'
    vault.hashicorp.com/role: 'pgnmobile-production'
    vault.hashicorp.com/agent-inject-secret-.env: 'pgn_mobile/data/production/data/secret'
    vault.hashicorp.com/secret-volume-path: '/vault/secret'
    vault.hashicorp.com/auth-path: 'auth/pgn-mobile-k8s'
    vault.hashicorp.com/template-static-secret-render-interval: '5'
    vault.hashicorp.com/agent-share-process-namespace: 'true'
    vault.hashicorp.com/agent-image: 'registry.pgn.co.id/base/vault-inject-custom:v1.2'
    vault.hashicorp.com/agent-inject-command-.env: "sh /opt/restart_deployment.sh"
    vault.hashicorp.com/agent-inject-template-.env: |
            {{- with secret "pgn_mobile/data/production/data/secret" }}{{ range $k, $v := .Data.data -}}
            {{- $k }}={{ $v }}
            {{ end }}{{ end -}}