{{- if .Values.ingress.enabled -}}
{{- $svcPort := .Values.service.targetPorthttp -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgnmobile-pgnfullfilmentservice-ingress
  labels:
    app: pgnmobile-pgnfullfilmentservice
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: doorv3-pgnmobile-pgnfullfilmentservice
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
